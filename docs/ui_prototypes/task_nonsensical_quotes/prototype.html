<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偉人の迷言 - UI Prototype (Self-Contained)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1a2a4a 0%, #0a192f 100%);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 高級感のある動的な背景装飾 */
        .bg-decor {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.3;
            background: 
                linear-gradient(217deg, rgba(212, 175, 55, .1), rgba(212, 175, 55, 0) 70.71%),
                linear-gradient(127deg, rgba(10, 25, 47, .1), rgba(10, 25, 47, 0) 70.71%),
                linear-gradient(336deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 70.71%);
        }
        .card-container {
            position: relative;
            width: 340px;
            height: 500px;
        }
        .quote-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 32px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            cursor: grab;
            transition: transform 0.1s ease-out;
            user-select: none;
        }
        .quote-content {
            font-family: 'Noto Serif JP', serif;
            font-size: 1.7rem;
            line-height: 1.7;
            color: #f8fafc;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        .author-info {
            text-align: right;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding-top: 25px;
        }
        .author-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #D4AF37;
        }
        .author-years {
            font-size: 0.8rem;
            color: #64748B;
            margin-top: 2px;
        }
        .author-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94A3B8;
            margin-bottom: 4px;
        }
        .swipe-hint {
            position: fixed;
            bottom: 40px;
            color: rgba(212, 175, 55, 0.4);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>
    <div class="bg-decor"></div>
    
    <div class="card-container" id="cardContainer"></div>

    <div class="swipe-hint">
        ← Swipe to Explore →
    </div>

    <script>
        const quotes = [
            { author: "エドゥアルト・フォン・クライン", title: "静寂の観測者", birthYear: 1812, deathYear: 1888, content: "扉が閉まっている時、それはまだ開いていないということなのだ。" },
            { author: "フリードリヒ・ヴィルヘルム・マイヤー", title: "概念の解体者", birthYear: 1745, deathYear: 1821, content: "何も動かないものにこそ、真の止まっている姿がある。" },
            { author: "アレクサンドル・イワノフ", title: "無限の思索家", birthYear: 1856, deathYear: 1932, content: "影が私を追いかけるのではない。私が光から逃げているだけなのだ。" },
            { author: "ヘンリー・アーサー・トンプソン", title: "未踏の哲学者", birthYear: 1690, deathYear: 1765, content: "お腹が空いたと感じる時、それはまだ満腹ではないという警告なんだよ。" }
        ];

        let currentIndex = 0;
        const container = document.getElementById('cardContainer');

        function createCard(quote) {
            const card = document.createElement('div');
            card.className = 'quote-card';
            card.innerHTML = `
                <div class="quote-content">${quote.content}</div>
                <div class="author-info">
                    <div class="author-title">${quote.title}</div>
                    <div class="author-name">${quote.author}</div>
                    <div class="author-years">(${quote.birthYear} — ${quote.deathYear})</div>
                </div>
            `;
            
            setupInteractions(card);
            return card;
        }

        function setupInteractions(card) {
            let startX = 0;
            let currentX = 0;
            let isDragging = false;

            card.addEventListener('mousedown', start);
            card.addEventListener('touchstart', (e) => start(e.touches[0]), {passive: true});

            window.addEventListener('mousemove', move);
            window.addEventListener('touchmove', (e) => move(e.touches[0]), {passive: false});

            window.addEventListener('mouseup', end);
            window.addEventListener('touchend', end);

            function start(e) {
                isDragging = true;
                startX = e.clientX;
                card.style.transition = 'none';
            }

            function move(e) {
                if (!isDragging) return;
                currentX = e.clientX - startX;
                const rotate = currentX / 20;
                card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
            }

            function end() {
                if (!isDragging) return;
                isDragging = false;
                card.style.transition = 'transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.5s ease-out';

                if (Math.abs(currentX) > 120) {
                    const direction = currentX > 0 ? 1 : -1;
                    card.style.transform = `translateX(${direction * 1000}px) rotate(${direction * 60}deg)`;
                    card.style.opacity = '0';
                    setTimeout(() => {
                        card.remove();
                        nextCard();
                    }, 500);
                } else {
                    card.style.transform = 'translateX(0) rotate(0)';
                }
            }
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % quotes.length;
            const card = createCard(quotes[currentIndex]);
            card.style.opacity = '0';
            card.style.transform = 'scale(0.8) translateY(20px)';
            container.appendChild(card);
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'scale(1) translateY(0)';
            }, 50);
        }

        container.appendChild(createCard(quotes[0]));
    </script>
</body>
</html>

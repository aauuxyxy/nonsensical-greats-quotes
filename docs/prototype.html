<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偉人の迷言 プロトタイプ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: 'serif';
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .header {
            padding: 40px 0 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ff9800;
            letter-spacing: 2px;
        }
        .card-container {
            flex: 1;
            width: 90%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            width: 100%;
            height: 400px;
            background: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            transition: transform 0.3s ease, opacity 0.3s ease;
            cursor: pointer;
            border: 1px solid #333;
        }
        .card.active {
            transform: translateX(0) scale(1);
            opacity: 1;
            z-index: 10;
        }
        .card.swiped-left {
            transform: translateX(-150%) rotate(-15deg);
            opacity: 0;
        }
        .card.swiped-right {
            transform: translateX(150%) rotate(15deg);
            opacity: 0;
        }
        .quote {
            font-size: 28px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .author {
            font-size: 18px;
            color: #aaaaaa;
        }
        .footer {
            padding: 20px;
            font-size: 14px;
            color: #666;
        }
        
        /* インタラクション用ボタン群（プロトタイプ向け） */
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">偉人の迷言</div>
    
    <div class="card-container" id="cardContainer">
        <!-- JSでカードを生成します -->
    </div>
    
    <div class="controls">
        <button class="btn" onclick="swipe('left')">← 次へ</button>
        <button class="btn" onclick="swipe('right')">次へ →</button>
    </div>

    <div class="footer">
        左右にスワイプして次の迷言へ
    </div>
</div>

<script>
    const originalQuotes = [
        { text: "冷蔵庫を開けて閉めるだけで、1日が過ぎていく。", author: "- 名もなき哲学者" },
        { text: "右を向いている間は、左が見えない。これが世界の真理だ。", author: "- 空間の探求者" },
        { text: "走れば走るほど、昨日に近づいている気がする。", author: "- 時をかける迷子" },
        { text: "カレーライスからカレーを引くと、そこにはライスがある。", author: "- 引き算の達人" },
        { text: "明日できることは、来世でもできる。", author: "- 究極の先延ばしニスト" }
    ];

    let currentQuotes = [];
    const container = document.getElementById('cardContainer');
    let currentIndex = 0;

    // 配列をシャッフルする関数
    function shuffleArray(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    function initDeck() {
        currentQuotes = shuffleArray(originalQuotes);
        currentIndex = 0;
        renderCards();
    }

    function renderCards() {
        container.innerHTML = '';
        currentQuotes.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `card ${index === currentIndex ? 'active' : ''}`;
            if (index < currentIndex) {
                card.style.display = 'none';
            }
            card.id = `card-${index}`;
            card.innerHTML = `
                <div class="quote">${q.text}</div>
                <div class="author">${q.author}</div>
            `;
            container.appendChild(card);
        });
    }

    function swipe(direction) {
        if (currentIndex >= currentQuotes.length) return;
        
        const currentCard = document.getElementById(`card-${currentIndex}`);
        if (direction === 'left') {
            currentCard.classList.add('swiped-left');
        } else {
            currentCard.classList.add('swiped-right');
        }
        
        currentCard.classList.remove('active');
        
        setTimeout(() => {
            currentCard.style.display = 'none';
            currentIndex++;
            if (currentIndex < currentQuotes.length) {
                const nextCard = document.getElementById(`card-${currentIndex}`);
                nextCard.classList.add('active');
            } else {
                // 一周したら再度シャッフルしてループ
                initDeck();
            }
        }, 300);
    }

    // 初期描画
    initDeck();
</script>
</body>
</html>
